# Случайное имя приложения — не выдаёт назначение сервиса. URL:
# https://oygrgn2mrp.fly.dev
# Поменять на своё: `fly apps create <новое-имя>` и замени app здесь.
app = "oygrgn2mrp"
primary_region = "waw"  # Варшава — ближайший к Минску регион Fly.io

[build]

[env]
  APP_DATA_DIR = "/data"

[[mounts]]
  source = "family_office_data"
  destination = "/data"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
